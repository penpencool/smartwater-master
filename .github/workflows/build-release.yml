name: Build and Release ESP32 Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Master Controller Firmware
        working-directory: master_control
        run: |
          pio run

      - name: Rename and Prepare Binary
        run: |
          mkdir -p build_output
          cp master_control/.pio/build/esp32doit/firmware.bin build_output/firmware.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: master-control-firmware
          path: build_output/firmware.bin

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/firmware.bin
          name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 Smart Water Master Controller Firmware (${{ github.ref_name }})
            
            ### Highlights
            - Dual-Core FreeRTOS Engine (Core 0: Network/Web, Core 1: Real-time Automation)
            - Thread-Safe Shared State with Recursive Mutex
            - Cloud OTA Auto-Update & Web UI Support
            
            ### Download
            - **Firmware Binary**: `firmware.bin`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
